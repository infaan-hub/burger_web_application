name: Keepalive

on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    name: Keep Neon + Render Alive
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend (wakes Neon DB + keeps Render warm)
        run: |
          curl -s --max-time 30 "https://burgersupreme.onrender.com/api/health/" || true

      - name: Ping Frontend (keeps Vercel warm)
        run: |
          curl -s --max-time 30 "https://infaanburgersupreme.vercel.app/" || true

      - name: Direct DB keepalive (if backend is cold)
        run: |
          curl -s --max-time 30 "https://burgersupreme.onrender.com/api/menu/" || true
